name: Build and deploy

# On every push to main:
#  1. check that the English course and every step of the Uzbek course still work,
#  2. build the Uzbek site,
#  3. put the ready-to-host files on the `deploy` branch (Vercel / Netlify / Cloudflare Pages serve that branch as-is).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12.1'
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '22.17.0'
    - name: Install Python and JS dependencies
      run: ./scripts/ci_run.sh ./scripts/install_deps.sh
    - name: Test the English course
      env:
        FUTURECODER_LANGUAGE: en
      run: |
        ./scripts/ci_run.sh poetry run python -m translations.generate_po_file
        ./scripts/ci_run.sh poetry run python -m scripts.generate_static_files
        ./scripts/ci_run.sh poetry run pytest tests/test_linting.py tests/test_steps.py
    - name: Test every step of the Uzbek course
      env:
        FUTURECODER_LANGUAGE: uz
        # The Uzbek transcript isn't stored in the repo; every step is still checked to pass.
        FIX_TESTS: 1
      run: |
        ./scripts/ci_run.sh poetry run python -m scripts.generate_static_files
        ./scripts/ci_run.sh poetry run pytest tests/test_steps.py
    - name: Build the Uzbek site
      env:
        FUTURECODER_LANGUAGE: uz
      run: ./scripts/ci_run.sh ./scripts/build.sh
    - name: Publish the built site to the deploy branch
      run: |
        cp deploy/vercel.json dist/
        cd dist
        git init -q -b deploy
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "Deploy ${GITHUB_SHA}"
        git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
